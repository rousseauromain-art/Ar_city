<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0E1A2B">
<title>Outils v2 — Villes à l'horizon</title>
<style>
:root{--ink:#0E1A2B;--panel:#16263B;--cream:#F3E9D2;--ochre:#E0A526;--mute:#8E9AAB;--ok:#6FCF97;--bad:#E85A5A}
*{box-sizing:border-box}
html,body{margin:0;background:var(--ink);color:var(--cream);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:640px;margin:0 auto;padding:max(18px,env(safe-area-inset-top)) 16px 60px}
h1{margin:4px 0 2px;font-size:26px}
h2{margin:26px 0 8px;font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--ochre)}
p,small{color:var(--mute);font-size:15px}
a{color:var(--ochre)}
button,.ligne{display:flex;width:100%;align-items:center;gap:12px;min-height:56px;margin:0 0 10px;padding:12px 16px;border-radius:12px;border:1px solid rgba(224,165,38,.55);background:var(--panel);color:var(--cream);font-family:inherit;font-weight:600;font-size:17px;line-height:1.3;text-align:left}
button{cursor:pointer}button:active{background:#1d3350}
.ligne{font-weight:400;border-color:rgba(243,233,210,.2)}.ligne b{display:block;font-weight:600}.ligne small{display:block}
.ligne input{width:26px;height:26px;flex:none}
#journal{list-style:none;margin:0;padding:0;max-height:300px;overflow:auto;border:1px solid rgba(243,233,210,.2);border-radius:12px;background:var(--panel);font:13px/1.45 ui-monospace,Menlo,Consolas,monospace}
#journal li{padding:6px 10px;border-bottom:1px solid rgba(243,233,210,.08);word-break:break-word}
#journal li.avert{color:#F2C14E}#journal li.erreur{color:var(--bad)}
.res{min-height:1.4em;margin:-2px 0 6px}
</style>
</head>
<body>
<main>
  <p><a href="../index.html">‹ Retour au lanceur</a></p>
  <h1>Outils v2</h1>
  <p>Version <b id="version">…</b>. Page de développement : la v1 (référence) n'est pas touchée.</p>

  <h2>Journal</h2>
  <ul id="journal" aria-live="polite"></ul>

  <h2>Relais</h2>
  <button id="btnRelais">Tester le relais</button>
  <p class="res" id="resRelais"></p>

  <h2>Rapport</h2>
  <button id="btnRapport">Exporter un rapport</button>
  <p class="res" id="resRapport"></p>

  <h2>Débogage</h2>
  <p id="debugEtat">…</p>

  <h2>Fonctions expérimentales</h2>
  <div id="drapeaux"></div>

  <h2>Stockage de la v2</h2>
  <p id="stockage">…</p>
  <button id="btnVider">Vider le stockage de la v2</button>
</main>
<script src="../config.js" onerror="void 0"></script>
<script type="module" src="../src/ui/outils-page.js"></script>
</body>
</html>
