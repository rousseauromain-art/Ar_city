name: Tests

on:
  push:
    paths-ignore: ['**.md']
  pull_request:
    paths-ignore: ['**.md']

# Les tests e2e et la parité avec la v1 ne tournent plus à chaque envoi (ils bloquaient les fusions) : Romain valide sur le téléphone. Ils restent lançables à la main : npm run test:e2e, ou parite.yml.
jobs:
  qualite:
    name: Qualité (lint, types, tests unitaires)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run types
      - run: npm run test:unit

  integration:
    name: Intégration (relief, lieux, monuments sur relief synthétique)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:integration
