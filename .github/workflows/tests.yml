name: Tests

on:
  push:
    paths-ignore: ['**.md']
  pull_request:
    paths-ignore: ['**.md']

# La v2 est gelée : ses tests (lint, types, unitaires, intégration, construction) ne tournent que si v2/ (ou l'outillage commun) change.
# Ceux de la v3 tournent à chaque envoi et pull request.

# v2 : les tests e2e et la parité ne tournent qu'à la main (npm run test:e2e, parite.yml).
jobs:
  v3:
    name: v3 — greffes (unitaires) et pages v1/v3 (Playwright), « tout éteint = v1 »
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PHOTOS_DIR: ${{ github.workspace }}/ar_city-photos
    steps:
      - uses: actions/checkout@v5
      # scènes réelles (dépôt privé) : seulement si le jeton est là ; sinon les tests sur scènes réelles sont ignorés, les autres tournent
      - id: photos
        env:
          PHOTOS_TOKEN: ${{ secrets.PHOTOS_TOKEN }}
        run: if [ -n "$PHOTOS_TOKEN" ]; then echo "ok=true" >> "$GITHUB_OUTPUT"; else echo "ok=false" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/checkout@v5
        if: steps.photos.outputs.ok == 'true'
        with:
          repository: rousseauromain-art/Ar_city-photos
          token: ${{ secrets.PHOTOS_TOKEN }}
          path: ar_city-photos
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:v3
      - run: npx playwright install --with-deps chromium
      - name: Pages v1 et v3 (greffes seules, toutes allumées, tout éteint = v1, roulis)
        env:
          PARITE_OBLIGATOIRE: ${{ steps.photos.outputs.ok == 'true' && '1' || '' }}
        run: npx playwright test --project=v3 --trace off

  changements:
    name: Fichiers modifiés
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      v2: ${{ steps.f.outputs.v2 }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - id: f
        env:
          AVANT: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -z "$AVANT" ] || ! git cat-file -e "$AVANT^{commit}" 2>/dev/null; then echo "v2=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          if git diff --name-only "$AVANT" HEAD | grep -qE '^(v2/|tests/commun/|package(-lock)?\.json|\.github/workflows/tests\.yml)'; then echo "v2=true"; else echo "v2=false"; fi >> "$GITHUB_OUTPUT"

  qualite:
    name: v2 — qualité (lint, types, tests unitaires, construction)
    needs: changements
    if: needs.changements.outputs.v2 == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run types
      - run: npm run test:unit
      - name: Construction du site publié (esbuild)
        run: npm run build

  integration:
    name: v2 — intégration (relief, lieux, monuments sur relief synthétique)
    needs: changements
    if: needs.changements.outputs.v2 == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:integration
